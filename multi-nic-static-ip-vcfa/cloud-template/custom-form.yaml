        state:
          visible: true
          read-only: false
        signpostPosition: right-middle
    - id: section_nic2Dhcp
      fields:
      - id: nic2Dhcp
        display: dropDown
        state:
          visible: true
          read-only: false
        signpostPosition: right-middle
    - id: section_nic2IpAddress
      fields:
      - id: nic2IpAddress
        display: textField
        state:
          visible:
          - equals:
              nic2Dhcp: 'No'
            value: true
          read-only: false
        signpostPosition: right-middle
    - id: section_nic2Netmask
      fields:
      - id: nic2Netmask
        display: textField
        state:
          visible:
          - equals:
              nic2Dhcp: 'No'
            value: true
          read-only: false
        signpostPosition: right-middle
    - id: section_nic3Network
      fields:
      - id: nic3Network
        display: dropDown
        state:
          visible: true
          read-only: false
        signpostPosition: right-middle
    - id: section_nic3Dhcp
      fields:
      - id: nic3Dhcp
        display: dropDown
        state:
          visible: true
          read-only: false
        signpostPosition: right-middle
    - id: section_nic3IpAddress
      fields:
      - id: nic3IpAddress
        display: textField
        state:
          visible:
          - equals:
              nic3Dhcp: 'No'
            value: true
          read-only: false
        signpostPosition: right-middle
    - id: section_nic3Netmask
      fields:
      - id: nic3Netmask
        display: textField
        state:
          visible:
          - equals:
              nic3Dhcp: 'No'
            value: true
          read-only: false
        signpostPosition: right-middle
    - id: section_ciGateway
