schema:
  project:
    label: Project
    type:
      dataType: string
      isMultiple: false
    valueList:
      id: projects
      type: scriptAction
    constraints:
      required: true
  environment:
    label: Environment
    type:
      dataType: string
      isMultiple: false
    default: Lab
    valueList:
    - Lab
    - Production
    - Staging
    constraints: {}
  deploymentName:
    label: Deployment Name
    type:
      dataType: string
      isMultiple: false
    default:
      bind:
        values:
        - '`lab-`'
        - vmName
        operator: concatenate
    constraints:
      required: true
  vmName:
    label: VM name
    description: Becomes the vCenter VM name and guest hostname. Lowercase letters, digits and hyphens; up to 40 chars.
    signpost: Becomes the vCenter VM name and guest hostname. Lowercase letters, digits and hyphens; up to 40 chars.
    type:
      dataType: string
      isMultiple: false
    default: ''
    constraints:
      max-value: 40
  image:
    label: Operating system
    type:
      dataType: string
      isMultiple: false
    default: Official Ubuntu
    valueList:
    - value: Official Ubuntu
      label: Official Ubuntu
    - value: RockyLinux
      label: RockyLinux
  size:
    label: VM size
    type:
      dataType: string
      isMultiple: false
    default: Small
    valueList:
    - value: Small
      label: Small (2 vCPU / 4 GB RAM)
    - value: Medium
      label: Medium (4 vCPU / 8 GB RAM)
    - value: Large
      label: Large (8 vCPU / 16 GB RAM)
    - value: X-Large
      label: X-Large (16 vCPU / 32 GB RAM)
  ntpServers:
    label: NTP servers
    description: Comma separated IPs or FQDNs. Leave blank to keep the image default.
    signpost: Comma separated IPs or FQDNs. Leave blank to keep the image default.
    type:
      dataType: string
      isMultiple: false
  bootDiskGb:
    label: Boot disk size (GB)
    signpost: Minimum 40 GB, the disk size of the Ubuntu 24.04 template behind the 'Official Ubuntu' image mapping. A smaller value fails during allocation. If you use a different image, check its disk size in vCenter and set this minimum (and the default) to match.
    type:
      dataType: integer
      isMultiple: false
    default: 40
    constraints:
      min-value: 40
      max-value: 2000
  dataDisks:
    label: Data disks
    signpost: Add one row per data disk. Leave empty for no data disks.
    type:
      dataType: complex
      isMultiple: true
      fields:
      - label: Size (GB)
        id: sizeGb
        type:
          dataType: integer
          isMultiple: false
        constraints:
          min-value: 1
          max-value: 3000
    default: []
  nic1Network:
    label: NIC 1 network
    type:
      dataType: string
      isMultiple: false
    valueList:
      id: in.co.cloudblogger.multinic/getNetworksByEnvironment
      type: scriptAction
      parameters:
      - $type:
          dataType: string
          isMultiple: false
        environment: environment
  nic1Dhcp:
    label: NIC 1 DHCP enabled?
    type:
      dataType: string
      isMultiple: false
    default: 'Yes'
    valueList:
    - value: 'Yes'
      label: 'Yes'
    - value: 'No'
      label: 'No'
  nic1IpAddress:
    label: NIC 1 IP address
    type:
      dataType: string
      isMultiple: false
  nic1Netmask:
    label: NIC 1 netmask
    type:
      dataType: string
      isMultiple: false
  nic2Network:
    label: NIC 2 network
    type:
      dataType: string
      isMultiple: false
    valueList:
      id: in.co.cloudblogger.multinic/getNetworksByEnvironment
      type: scriptAction
      parameters:
      - $type:
          dataType: string
          isMultiple: false
        environment: environment
  nic2Dhcp:
    label: NIC 2 DHCP enabled?
    type:
      dataType: string
      isMultiple: false
    default: 'Yes'
    valueList:
    - value: 'Yes'
      label: 'Yes'
    - value: 'No'
      label: 'No'
  nic2IpAddress:
    label: NIC 2 IP address
    type:
      dataType: string
      isMultiple: false
  nic2Netmask:
    label: NIC 2 netmask
    type:
      dataType: string
      isMultiple: false
  nic3Network:
    label: NIC 3 network
    type:
      dataType: string
      isMultiple: false
    valueList:
      id: in.co.cloudblogger.multinic/getNetworksByEnvironment
      type: scriptAction
      parameters:
      - $type:
          dataType: string
          isMultiple: false
        environment: environment
  nic3Dhcp:
    label: NIC 3 DHCP enabled?
    type:
      dataType: string
      isMultiple: false
    default: 'Yes'
    valueList:
    - value: 'Yes'
      label: 'Yes'
    - value: 'No'
      label: 'No'
  nic3IpAddress:
    label: NIC 3 IP address
    type:
      dataType: string
      isMultiple: false
  nic3Netmask:
    label: NIC 3 netmask
    type:
      dataType: string
      isMultiple: false
  ciGateway:
    label: Default gateway
    signpost: Applied to the first static NIC only.
    type:
      dataType: string
      isMultiple: false
  ciDNS:
    label: DNS servers
    signpost: Comma separated.
    type:
      dataType: string
      isMultiple: false
  ciDomain:
    label: Domain
    type:
      dataType: string
      isMultiple: false
  vmUsername:
    label: VM username
    signpost: Optional extra login created in the guest with sudo rights. Leave blank to skip.
    type:
      dataType: string
      isMultiple: false
  vmPassword:
    label: VM password
    signpost: Password for the VM username above.
    type:
      dataType: secureString
      isMultiple: false
options:
  externalValidations: []
